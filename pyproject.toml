[project]
name = "aerorul"
version = "0.1.0"
description = "Turbofan engine RUL prediction: sensor data -> health indicator -> RUL -> failure risk -> maintenance recommendation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "mlflow>=2.16",
    "joblib>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "pydantic>=2.9",
]
dl = [
    "torch>=2.4",
]
survival = [
    "lifelines>=0.29",
]
notebooks = [
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerorul"]

[tool.ruff]
line-length = 100
target-version = "py311"
